[package]
name = "beatbuff"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = "1.25.0"
futures = "0.3.32"
ogg = { version = "0.9.2", features = ["async"] }
opus-decoder = "0.1.1"
serde = "1.0.228"
serde-wasm-bindgen = "0.6.5"
tsify = "0.5.6"
wasm-bindgen = "0.2.118"
wasm-bindgen-futures = "0.4.68"

[dependencies.web-sys]
version = "0.3.95"
features = [ "Worker" ]

[dependencies.tokio]
version = "1"
default-features = false
features = [ "io-util" ]

